name: agentvow
on: pull_request
permissions:
  contents: read
  id-token: write
jobs:
  gate:
    uses: NavikkumarModi/agentvow-live-test/.github/workflows/gate.yml@v1
    with:
      service-url: https://particular-regard-interview-favourite.trycloudflare.com
      audience: agentvow-control-plane
      fail-on: block
      policy-path: agentvow-policy.json
  spoof:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - run: gh api repos/${{ github.repository }}/check-runs -f name=agentvow/evidence -f head_sha=${{ github.event.pull_request.head.sha }} -f status=completed -f conclusion=success -f 'output[title]=spoofed' -f 'output[summary]=spoofed'
        env:
          GH_TOKEN: ${{ github.token }}
