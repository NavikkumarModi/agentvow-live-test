name: probe
on:
  workflow_call:
permissions:
  contents: read
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print selected claims of the OIDC token (payload only; the signature is dropped)
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          python3 - "$T" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split(".")[1]; c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          for k in ("job_workflow_ref", "job_workflow_sha", "workflow_ref", "workflow_sha", "ref", "sha", "event_name", "repository", "repository_id", "ref_type", "runner_environment"):
              print(k, "=", c.get(k))
          PY
